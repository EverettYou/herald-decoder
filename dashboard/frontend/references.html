<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>References · Herald Decoder</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"></main><script src="/js/app.js"></script><script>api('/api/references').then(d=>{const entries=d.references.length?d.references.map(r=>`<li><b>${escapeHtml(r.title||r.id)}</b> <span class="muted">${escapeHtml(r.kind||'reference')} · ${escapeHtml(r.status||'listed')}</span></li>`).join(''):'<div class="empty">No references have been registered yet. The first collection pass will add project-relevant papers or repositories with provenance.</div>';document.querySelector('#app').innerHTML=`<div class="eyebrow">Source archive</div><h1>References</h1><p class="lede">Papers, repositories, datasets, and notes are preserved as sources—not quality-scored candidates.</p><div class="grid">${card('Registered references',`<ul class="list">${entries}</ul>`,'full')}</div>`});</script></body></html>
