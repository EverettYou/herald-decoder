<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labs · Herald Decoder</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"></main><script src="/js/app.js"></script><script>api('/api/labs').then(d=>{document.querySelector('#app').innerHTML=`<div class="eyebrow">Experimental workspace</div><h1>Labs</h1><p class="lede">Each lab is a focused research loop: plan, execute, report, and promote only supported knowledge or repeatedly validated code.</p><div class="grid">${d.labs.map(l=>`<a class="card link-card ${l.stage==='active'?'action':''}" href="/lab?id=${l.id}"><span class="status ${l.stage}">${l.stage}</span><h2 style="margin-top:12px">${l.title}</h2><p>${l.summary}</p><p class="muted"><b>Now:</b> ${l.current_focus}</p><p class="muted">Next: ${l.next_action}</p></a>`).join('')}</div>`});</script></body></html>
