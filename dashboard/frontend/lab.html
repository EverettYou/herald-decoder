<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab · Herald Decoder</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"></main><script src="/js/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
Promise.all([api('/api/labs'),api('/api/lab?id='+encodeURIComponent(id))]).then(([catalog,detail])=>{const lab=catalog.labs.find(x=>x.id===id);if(!lab)throw new Error('Unknown lab');const phase=Object.entries(detail.progress).map(([name,state])=>`<span class="${state==='active'?'active':state==='queued'?'queued':''}">${name}: ${state}</span>`).join('');const items=xs=>xs.length?`<ul class="list">${xs.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<p class="muted">None recorded.</p>';document.querySelector('#app').innerHTML=`<div class="eyebrow">Lab control surface</div><h1>${lab.title}</h1><p class="lede">${lab.summary}</p><div class="grid">${card('Research snapshot',`<span class="status ${lab.stage}">${lab.stage}</span><p><b>Question:</b> ${detail.question}</p><p><b>Current focus:</b> ${lab.current_focus}</p><div class="phase">${phase}</div>`,'wide')}${card('Next action',`<p>${lab.next_action}</p><p class="muted">Updated ${lab.updated}</p>`,'action')}${card('Motivation',`<p>${detail.motivation}</p>`,'wide')}${card('Open frontier',items(detail.frontier))}${card('Blockers',items(detail.blockers))}${card('Resolved',items(detail.resolved))}${card('Promotion candidates',`<p class="muted">No source-code promotion is assumed at lab start.</p>${items(detail.promotion_candidates)}`)}${card('Report access',`<p>The dashboard keeps the current state compact. Plan and report remain the canonical detailed record.</p><details><summary>How this page stays useful</summary><p>It foregrounds the current question, active phase, next action, open frontier, blockers, and resolved issues. Detailed methods and data stay in the lab files until they are needed.</p></details>`,'full')}</div>`;}).catch(e=>document.querySelector('#app').innerHTML=`<h1>Lab unavailable</h1><p>${escapeHtml(e.message)}</p>`);
</script></body></html>
