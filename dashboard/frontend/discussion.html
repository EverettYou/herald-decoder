<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discussion · Herald Decoder</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"></main><script src="/js/app.js"></script><script>api('/api/discussion').then(d=>{const detail=d.open_threads?`<ul class="list">${d.threads.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<div class="empty">No open threads. Create a Markdown thread in <code>discussion/threads/</code> when a decision needs a durable record.</div>';document.querySelector('#app').innerHTML=`<div class="eyebrow">Research supervision</div><h1>Discussion</h1><p class="lede">A small, project-wide place for open decisions, questions, and resolutions. Labs may point here, but do not create separate local discussion systems.</p><div class="grid">${card('Open threads',`<div class="metric">${d.open_threads}</div>${detail}`,'wide')}${card('What belongs here',`<p>Choices that materially change a model, decoder, experimental design, or interpretation. Record the decision and its reason when resolved.</p>`)}</div>`});</script></body></html>
