<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiki · Herald Decoder</title><link rel="stylesheet" href="/css/style.css"></head><body><main id="app"></main><script src="/js/app.js"></script><script>Promise.all([api('/api/project'),api('/api/wiki-index')]).then(([p,w])=>{document.querySelector('#app').innerHTML=`<div class="eyebrow">Shared compiled knowledge</div><h1>Wiki</h1><p class="lede">One Wiki serves the entire project. References contribute cited background; completed labs contribute evidence-backed findings.</p><div class="grid">${card('Current thesis',`<p>${p.thesis}</p><a href="/labs">See the lab frontier →</a>`,'wide')}${card('Promotion rule',`<p>Do not promote a prospective plan as a result. Cite the reference or completed report behind every claim.</p>`)}${card('Wiki index',`<pre>${escapeHtml(w.content)}</pre>`,'full')}</div>`});</script></body></html>
